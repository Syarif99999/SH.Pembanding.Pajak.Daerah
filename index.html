<style>
  :root {
    --navy: #1B2A4A;
    --navy2: #24365E;
    --gold: #EFD05C;
    --gold-light: #FBF4D9;
    --bg: #F4F6FA;
    --gray: #64748B;
    --green: #16A34A;
    --red: #DC2626;
    --amber: #B45309;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: #1e293b; }
  header { background: linear-gradient(135deg, var(--navy), var(--navy2)); color: white; padding: 20px 16px 52px; }
  header .top { display:flex; align-items:center; justify-content: space-between; gap:10px; flex-wrap: wrap; }
  header .badge { background: var(--gold); color: var(--navy); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 5px; }
  header h1 { font-size: 18px; margin: 10px 0 2px; }
  header p { margin: 0; font-size: 12px; opacity: 0.85; }
  #syncStatus { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: #7a5a1f; white-space: nowrap; }

  main { max-width: 960px; margin: -34px auto 60px; padding: 0 14px; }

  .card { background: white; border-radius: 14px; box-shadow: 0 4px 18px rgba(27,42,74,0.10); padding: 14px; margin-bottom: 16px; }

  .moduleTabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .moduleTab { flex: 1; min-width: 90px; text-align:center; padding: 10px 8px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; background: #f1f5f9; color: var(--navy); border: 2px solid transparent; }
  .moduleTab.active { background: var(--navy); color: white; }

  .subTabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x:auto; }
  .subTab { padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; background: #f1f5f9; color: var(--gray); white-space: nowrap; }
  .subTab.active { background: var(--gold); color: var(--navy); }

  .toolRow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom: 10px; }
  input[type="text"] { flex: 1; min-width: 160px; padding: 9px 12px; border: 1.5px solid #e2e8f0; border-radius: 9px; font-size: 13px; }
  .btn { padding: 9px 14px; border-radius: 9px; font-size: 12.5px; font-weight: 700; cursor: pointer; border: none; }
  .btn-gold { background: var(--gold); color: var(--navy); }
  .btn-outline { background: white; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn-sm { padding: 6px 10px; font-size: 11.5px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid #eef1f6; }
  th:first-child, td:first-child { text-align: left; }
  th { background: #f8fafc; color: var(--navy); font-size: 11.5px; text-transform: uppercase; letter-spacing: .3px; position: sticky; top:0; }
  tbody tr:hover { background: var(--gold-light); cursor: pointer; }
  .tableWrap { overflow-x: auto; max-height: 480px; overflow-y: auto; border-radius: 10px; }

  .growth-up { color: var(--green); font-weight: 700; }
  .growth-down { color: var(--red); font-weight: 700; }
  .growth-flat { color: var(--gray); }

  .meta { font-size: 11.5px; color: var(--gray); margin: 6px 2px 12px; }

  .modalBg { display:none; position: fixed; inset:0; background: rgba(15,23,42,0.55); z-index: 50; align-items:center; justify-content:center; padding: 16px; }
  .modalBg.show { display:flex; }
  .modal { background: white; border-radius: 14px; max-width: 720px; width:100%; max-height: 85vh; overflow-y:auto; padding: 18px; }
  .modal h3 { margin-top:0; color: var(--navy); font-size: 15px; }
  .modal .sub { font-size: 12px; color: var(--gray); margin-bottom: 10px; }
  .closeBtn { float:right; background:none; border:none; font-size: 20px; cursor:pointer; color: var(--gray); }

  #toast { display:none; position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--navy); color:white; padding: 10px 18px; border-radius: 10px; font-size: 12.5px; z-index: 60; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .empty { text-align:center; padding: 30px 10px; color: var(--gray); font-size: 13px; }
  #fileInput { display:none; }
  .chartBox { background: white; border: 1px solid #eef1f6; border-radius: 10px; padding: 10px 8px; margin-bottom: 12px; }
  .chartBox canvas { max-height: 260px; }
  .loadMoreWrap { text-align:center; padding: 10px; }
  .limitNote { text-align:center; font-size: 11.5px; color: var(--gray); padding: 8px; }
  .formGrid { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .formGrid input { width:100%; padding: 9px 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 13px; }
  .monthGrid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .monthGrid label { font-size: 10.5px; color: var(--gray); display:block; margin-bottom: 3px; font-weight:600; }
  .monthGrid input { width:100%; padding: 7px 8px; border: 1.5px solid #e2e8f0; border-radius: 7px; font-size: 12px; }
  select#fTahun { padding: 7px 10px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 12.5px; }
  .install-btn { position: fixed; right: 16px; bottom: 16px; background: var(--gold); color: var(--navy); border:none; border-radius: 50px; padding: 12px 18px; font-weight:700; font-size:12.5px; box-shadow: 0 6px 18px rgba(0,0,0,.25); display:none; z-index: 40; }
</style>

let onlineModules = 0;

function setSyncStatus(text, bg) {
  const el = document.getElementById('syncStatus');
  el.textContent = text;
  if (bg) el.style.background = bg;
}

function initCloudSync() {
  try {
    firebase.initializeApp(firebaseConfig);
    cloudDb = firebase.firestore();
  } catch (err) {
    console.warn('Firebase gagal diinisialisasi, mode offline:', err);
    setSyncStatus('⚠️ Mode Offline (tanpa sync)', '#7a1f1f');
    return;
  }

  Object.keys(MODULES).forEach((mod) => {
    const ref = cloudDb.collection('warkop_pajak_pembanding').doc(mod);
    cloudDocs[mod] = ref;
    ref.onSnapshot(
      (snap) => {
        if (!snap.exists) {
          const local = loadData(mod);
          syncToCloud(mod, local);
          return;
        }
        const remote = snap.data();
        const remoteJson = JSON.stringify(remote);
        if (remoteJson === lastPushedJson[mod]) { markOnline(); return; }
        isApplyingRemote[mod] = true;
        try {
          localStorage.setItem(lsKey(mod), JSON.stringify(remote));
          lastPushedJson[mod] = remoteJson;
          if (mod === currentModule) renderAll();
          showToast('🔄 Data ' + MODULES[mod].label + ' diperbarui dari tim.');
        } finally {
          isApplyingRemote[mod] = false;
        }
        markOnline();
      },
      (err) => {
        console.warn('Sync bermasalah untuk', mod, err);
        setSyncStatus('🟡 Offline - hanya lokal', '#7a5a1f');
      }
    );
  });
}

function markOnline() {
  setSyncStatus('🟢 Online - Tersinkron', '#1f6f3f');
}

function syncToCloud(mod, payload) {
  const ref = cloudDocs[mod];
  if (!ref || isApplyingRemote[mod]) return;
  const json = JSON.stringify(payload);
  lastPushedJson[mod] = json;
  ref.set(payload).catch((err) => {
    console.warn('Gagal mengirim ke cloud (' + mod + '):', err);
    setSyncStatus('🟡 Offline - hanya lokal', '#7a5a1f');
  });
}

// =============================================================================
// UTIL
// =============================================================================
function rupiah(n) {
  n = Number(n) || 0;
  return "Rp " + Math.round(n).toLocaleString("id-ID");
}
function pct(g) {
  if (g === null || g === undefined || !isFinite(g)) return '<span class="growth-flat">-</span>';
  const val = (g * 100).toFixed(1) + "%";
  if (g > 0.001) return '<span class="growth-up">▲ ' + val + '</span>';
  if (g < -0.001) return '<span class="growth-down">▼ ' + val + '</span>';
  return '<span class="growth-flat">' + val + '</span>';
}
function growth(curr, prev) {
  if (!prev || prev <= 0) return null;
  return (curr - prev) / prev;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => (t.style.display = 'none'), 2800);
}

// =============================================================================
// AGREGASI DATA
// =============================================================================
function aggregateRingkasanBulanan(records) {
  const totals = {}; // year -> [12]
  YEARS.forEach(y => totals[y] = new Array(12).fill(0));
  records.forEach(r => {
    YEARS.forEach(y => {
      const d = r.data && r.data[y];
      if (d && d.monthly) {
        d.monthly.forEach((v, i) => { totals[y][i] += (v || 0); });
      }
    });
  });
  return totals;
}

function aggregateJenisUsaha(records) {
  const map = {};
  records.forEach(r => {
    const jenis = r.jenis || "(Tanpa Kategori)";
    if (!map[jenis]) {
      map[jenis] = {};
      YEARS.forEach(y => map[jenis][y] = 0);
    }
    YEARS.forEach(y => {
      const d = r.data && r.data[y];
      map[jenis][y] += d ? (d.total || 0) : 0;
    });
  });
  return map;
}

function drawRingkasanChart(totals) {
  const canvas = document.getElementById('ringkasanChart');
  if (!canvas) return;
  if (typeof Chart === 'undefined') {
    canvas.parentElement.innerHTML = '<div class="empty">⚠️ Modul grafik gagal dimuat. Coba muat ulang halaman.</div>';
    return;
  }
  if (ringkasanChartInstance) { ringkasanChartInstance.destroy(); }
  const colors = { "2024": "#94A3B8", "2025": "#EFD05C", "2026": "#1B2A4A" };
  ringkasanChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: MONTHS,
      datasets: YEARS.map(y => ({
        label: y,
        data: totals[y],
        borderColor: colors[y],
        backgroundColor: colors[y],
        tension: 0.3,
        borderWidth: y === "2026" ? 3 : 2,
        pointRadius: 3
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: {
        y: { ticks: { callback: (v) => (v / 1e6).toFixed(0) + 'jt', font: { size: 10 } } },
        x: { ticks: { font: { size: 10 } } }
      }
    }
  });
}

function drawJenisChart(map) {
  const canvas = document.getElementById('jenisChart');
  if (!canvas) return;
  if (typeof Chart === 'undefined') {
    canvas.parentElement.innerHTML = '<div class="empty">⚠️ Modul grafik gagal dimuat. Coba muat ulang halaman.</div>';
    return;
  }
  if (jenisChartInstance) { jenisChartInstance.destroy(); }
  const jenisList = Object.keys(map).sort((a,b) => map[b]["2026"] - map[a]["2026"]).slice(0, 10);
  jenisChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: jenisList,
      datasets: [{
        label: '2026',
        data: jenisList.map(j => map[j]["2026"]),
        backgroundColor: '#1B2A4A'
      }, {
        label: '2025',
        data: jenisList.map(j => map[j]["2025"]),
        backgroundColor: '#EFD05C'
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } } },
      scales: {
        x: { ticks: { callback: (v) => (v / 1e6).toFixed(0) + 'jt', font: { size: 10 } } },
        y: { ticks: { font: { size: 10 } } }
      }
    }
  });
}

const SEARCHABLE_SUBS = ['perwp', 'perwpbulanan', 'data2024', 'data2025', 'data2026'];

function renderToolbar() {
  const el = document.getElementById('toolRow');
  let html = '';
  if (SEARCHABLE_SUBS.includes(currentSub)) {
    html += `<input type="text" id="searchBox" placeholder="Cari nama WP / NPWPD / alamat..." value="${searchTerm.replace(/"/g,'&quot;')}" oninput="onSearch(this.value)" />`;
    const presetYear = currentSub.startsWith('data') ? currentSub.replace('data', '') : YEARS[YEARS.length - 1];
    html += `<button class="btn btn-outline" onclick="openEntryForm(null, '${presetYear}')">➕ Tambah WP</button>`;
  }
  Object.keys(MODULES).forEach(m => {
    const cls = m === currentModule ? 'btn btn-gold' : 'btn btn-outline';
    html += `<button class="${cls}" onclick="startUpload('${m}')">⬆ Upload Data ${MODULES[m].label}</button>`;
  });
  el.innerHTML = html;
}
function onSearch(v) {
  searchTerm = v;
  showAllRows = false;
  renderContent();
}
function filterRecords(records, term) {
  term = (term || '').trim().toLowerCase();
  if (!term) return records;
  return records.filter(r =>
    (r.nama || '').toLowerCase().includes(term) ||
    (r.npwpd || '').toLowerCase().includes(term) ||
    (r.alamat || '').toLowerCase().includes(term) ||
    (r.jenis || '').toLowerCase().includes(term)
  );
}
function showAll() {
  showAllRows = true;
  renderContent();
}

function renderAll() {
  renderModuleTabs();
  renderSubTabs();
  renderToolbar();
  renderContent();
  renderMeta();
}

function renderMeta() {
  const payload = loadData(currentModule);
  const el = document.getElementById('metaInfo');
  const count = (payload.records || []).length;
  const updated = payload.updatedAt ? new Date(payload.updatedAt).toLocaleString('id-ID') : '(data awal / seed)';
  el.textContent = `${count} Wajib Pajak/Objek — Terakhir diperbarui: ${updated}`;
}

function renderContent() {
  const el = document.getElementById('content');
  const payload = loadData(currentModule);
  const records = payload.records || [];

  if (records.length === 0) {
    el.innerHTML = '<div class="empty">Belum ada data untuk modul ini. Silakan upload data Excel.</div>';
    return;
  }

  if (currentSub === 'ringkasan') {
    el.innerHTML = renderRingkasanHTML(records);
    setTimeout(() => drawRingkasanChart(aggregateRingkasanBulanan(records)), 0);
  } else if (currentSub === 'jenis') {
    el.innerHTML = renderJenisHTML(records);
    setTimeout(() => drawJenisChart(aggregateJenisUsaha(records)), 0);
  } else if (currentSub === 'perwp') {
    el.innerHTML = renderPerWPHTML(records);
  } else if (currentSub === 'perwpbulanan') {
    el.innerHTML = renderPerWPBulananHTML(records);
  } else if (currentSub.startsWith('data')) {
    const year = currentSub.replace('data', '');
    el.innerHTML = renderDataYearHTML(records, year);
  }
}

function renderRingkasanHTML(records) {
  const totals = aggregateRingkasanBulanan(records);
  let rows = '';
  const yearTotal = { "2024":0, "2025":0, "2026":0 };
  MONTHS.forEach((m, i) => {
    const v24 = totals["2024"][i], v25 = totals["2025"][i], v26 = totals["2026"][i];
    yearTotal["2024"] += v24; yearTotal["2025"] += v25; yearTotal["2026"] += v26;
    rows += `<tr>
      <td>${m}</td>
      <td>${rupiah(v24)}</td>
      <td>${rupiah(v25)}</td>
      <td>${rupiah(v26)}</td>
      <td>${pct(growth(v25, v24))}</td>
      <td>${pct(growth(v26, v25))}</td>
    </tr>`;
  });
  rows += `<tr style="font-weight:800;background:#f8fafc;">
    <td>TOTAL SETAHUN</td>
    <td>${rupiah(yearTotal["2024"])}</td>
    <td>${rupiah(yearTotal["2025"])}</td>
    <td>${rupiah(yearTotal["2026"])}</td>
    <td>${pct(growth(yearTotal["2025"], yearTotal["2024"]))}</td>
    <td>${pct(growth(yearTotal["2026"], yearTotal["2025"]))}</td>
  </tr>`;
  return `
  <div class="chartBox"><canvas id="ringkasanChart"></canvas></div>
  <div class="tableWrap"><table>
    <thead><tr><th>Bulan</th><th>2024</th><th>2025</th><th>2026</th><th>Growth 25/24</th><th>Growth 26/25</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderPerWPHTML(records) {
  let filtered = filterRecords(records, searchTerm);
  filtered = filtered.slice().sort((a,b) => {
    const ta = (a.data && a.data["2026"] && a.data["2026"].total) || 0;
    const tb = (b.data && b.data["2026"] && b.data["2026"].total) || 0;
    return tb - ta;
  });

  if (filtered.length === 0) {
    return '<div class="empty">Tidak ada Wajib Pajak yang cocok dengan pencarian.</div>';
  }

  const total = filtered.length;
  const limited = (!showAllRows && !searchTerm.trim() && total > ROW_LIMIT) ? filtered.slice(0, ROW_LIMIT) : filtered;

  const rows = limited.map((r) => {
    const realIdx = records.indexOf(r);
    const d24 = (r.data && r.data["2024"] && r.data["2024"].total) || 0;
    const d25 = (r.data && r.data["2025"] && r.data["2025"].total) || 0;
    const d26 = (r.data && r.data["2026"] && r.data["2026"].total) || 0;
    return `<tr onclick="openDetail(${realIdx})">
      <td>${r.nama || '-'}<br><small style="color:var(--gray);">${r.jenis || ''}</small></td>
      <td>${rupiah(d24)}</td>
      <td>${rupiah(d25)}</td>
      <td>${rupiah(d26)}</td>
      <td>${pct(growth(d26, d25))}</td>
    </tr>`;
  }).join('');

  const note = limited.length < total
    ? `<div class="limitNote">Menampilkan ${limited.length} dari ${total} WP (urut nilai 2026 terbesar). Gunakan pencarian atau tombol di bawah untuk lihat semua.</div>
       <div class="loadMoreWrap"><button class="btn btn-outline btn-sm" onclick="showAll()">Tampilkan Semua (${total})</button></div>`

    <div class="formGrid">
      <input id="fNama" placeholder="Nama WP / Objek" value="${(rec && rec.nama || '').replace(/"/g, '&quot;')}">
      <input id="fJenis" placeholder="Jenis/Kategori Usaha" value="${(rec && rec.jenis || '').replace(/"/g, '&quot;')}">
      <input id="fAlamat" placeholder="Alamat" value="${(rec && rec.alamat || '').replace(/"/g, '&quot;')}">
      <input id="fNpwpd" placeholder="NPWPD" value="${(rec && rec.npwpd || '').replace(/"/g, '&quot;')}">
    </div>
    <div class="toolRow" style="margin-bottom:10px;">
      <label style="font-size:12.5px;font-weight:600;">Tahun:</label>
      <select id="fTahun" onchange="switchFormYear(${idxArg})">${yearOptions}</select>
    </div>
    <div class="monthGrid">${monthInputs}</div>
    <div style="font-weight:700;margin-bottom:12px;">Total tahun <span id="fTotalYearLabel">${year}</span>: <span id="fTotal">${rupiah(totalNow)}</span></div>
    <div class="toolRow">
      <button class="btn btn-gold" onclick="saveEntryForm(${idxArg})">💾 Simpan</button>
      ${rec ? `<button class="btn btn-outline" style="color:var(--red);border-color:var(--red);" onclick="deleteWP(${idx})">🗑️ Hapus WP Ini</button>` : ''}
    </div>
  `;
  document.getElementById('modalBg').classList.add('show');
}

function switchFormYear(idx) {
  const year = document.getElementById('fTahun').value;
  const payload = loadData(currentModule);
  const rec = (idx !== null && idx !== undefined) ? payload.records[idx] : null;
  const monthly = (rec && rec.data && rec.data[year] && rec.data[year].monthly) || new Array(12).fill(0);
  monthly.forEach((v, i) => { document.getElementById('fMonth' + i).value = v || 0; });
  updateFormTotal();
}

function updateFormTotal() {
  let total = 0;
  for (let i = 0; i < 12; i++) { total += Number(document.getElementById('fMonth' + i).value) || 0; }
  document.getElementById('fTotal').textContent = rupiah(total);
  document.getElementById('fTotalYearLabel').textContent = document.getElementById('fTahun').value;
}

function saveEntryForm(idx) {
  const nama = document.getElementById('fNama').value.trim();
  const jenis = document.getElementById('fJenis').value.trim();
  const alamat = document.getElementById('fAlamat').value.trim();
  const npwpd = document.getElementById('fNpwpd').value.trim();
  const year = document.getElementById('fTahun').value;
  if (!nama) { showToast('⚠️ Nama WP wajib diisi.'); return; }

  const monthly = [];
  for (let i = 0; i < 12; i++) { monthly.push(Number(document.getElementById('fMonth' + i).value) || 0); }
  const total = monthly.reduce((a, b) => a + b, 0);

  const payload = loadData(currentModule);
  const records = payload.records || [];

  if (idx !== null && idx !== undefined && records[idx]) {
    const rec = records[idx];
    rec.nama = nama; rec.jenis = jenis; rec.alamat = alamat; rec.npwpd = npwpd;
    if (!rec.data) rec.data = {};
    rec.data[year] = { monthly, total };
  } else {
    const newRec = { nama, jenis, alamat, npwpd, data: {} };
    newRec.data[year] = { monthly, total };
    records.push(newRec);
  }

  payload.records = records;
  payload.updatedAt = Date.now();
  saveData(currentModule, payload);
  closeModal();
  showToast('✅ Data Wajib Pajak berhasil disimpan & disinkronkan.');
}

function deleteWP(idx) {
  const payload = loadData(currentModule);
  const rec = payload.records[idx];
  if (!rec) return;
  const ok = confirm(`Hapus seluruh data "${rec.nama || '-'}" dari modul ${MODULES[currentModule].label}?\n\nTindakan ini tidak bisa dibatalkan.`);
  if (!ok) return;
  payload.records.splice(idx, 1);
  payload.updatedAt = Date.now();
  saveData(currentModule, payload);
  closeModal();
  showToast('🗑️ Wajib Pajak berhasil dihapus.');
}

// =============================================================================
// UPLOAD EXCEL BARU — membaca sheet "Data 2024/2025/2026" (format sama seperti
// file perbandingan SIMPADATAKA), lalu mengganti data modul sesuai tombol upload yang ditekan
// (Hotel / Hiburan / Reklame terpisah, tidak lagi bergantung tab aktif).
// =============================================================================
let uploadTarget = null;
function startUpload(mod) {
  uploadTarget = mod;
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', function (e) {
  const file = e.target.files[0];
  const mod = uploadTarget;
  e.target.value = '';
  uploadTarget = null;
  if (!file || !mod) return;
  const label = MODULES[mod].label;

  // Peringatan bila nama file menyebut modul lain (mis. upload file "hotel" ke tombol Reklame)
  const fname = file.name.toLowerCase();
  const mismatch = Object.keys(MODULES).filter(m => m !== mod && fname.includes(m));
  if (mismatch.length && !fname.includes(mod)) {
    const other = MODULES[mismatch[0]].label;
    if (!confirm(`Nama file "${file.name}" tampaknya data ${other}, tetapi Anda menekan Upload Data ${label}.\n\nLanjutkan mengganti data ${label}?`)) return;
  }

  const reader = new FileReader();
  reader.onload = function (evt) {
    try {
      const wb = XLSX.read(evt.target.result, { type: 'array' });
      const records = parseWorkbook(wb);
      if (records.length === 0) {
        showToast('⚠️ Tidak ditemukan sheet "Data 2024/2025/2026" yang sesuai format.');
        return;
      }
      const lama = (loadData(mod).records || []).length;
      const ok = confirm(`Ganti data ${label.toUpperCase()}?\n\nData saat ini: ${lama} WP\nData dari file: ${records.length} WP\n\nHanya modul ${label} yang diganti. Modul lain tidak berubah.`);
      if (!ok) return;
      saveData(mod, { records, updatedAt: Date.now() });
      showToast(`✅ Data ${label} diperbarui (${records.length} WP) & disinkronkan.`);
    } catch (err) {
      console.error(err);
      showToast('❌ Gagal membaca file. Pastikan format sesuai template.');
    }
  };
  reader.readAsArrayBuffer(file);
});

function parseWorkbook(wb) {
  const recordMap = {};
  const order = [];
  YEARS.forEach(y => {
    const sheetName = "Data " + y;
    if (!wb.Sheets[sheetName]) return;
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: 0 });
    // baris ke-5 (index 4) adalah header kolom; data mulai baris ke-6 (index 5)
    for (let i = 4; i < rows.length; i++) {
      const row = rows[i];
      if (!row || !row[1]) continue;
      const jenis = row[0], nama = row[1], alamat = row[2], npwpd = row[3];
      const monthly = row.slice(4, 16).map(v => Number(v) || 0);
      const total = Number(row[16]) || monthly.reduce((a,b) => a+b, 0);
      const key = (npwpd || '') + '|' + nama;
      if (!recordMap[key]) {
        recordMap[key] = { jenis, nama, alamat, npwpd, data: {} };
        order.push(key);
      }
      recordMap[key].data[y] = { monthly, total };
    }
  });
  return order.map(k => recordMap[k]);
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').style.display = 'none';
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// INIT
// =============================================================================
renderAll();
initCloudSync();
</script>
